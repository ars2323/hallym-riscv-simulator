# A published release, as a student gets it (the Hallym MIPS edition's
# release-check.yml, v2.7.1, for this app):
#   - the release is Latest, its only asset is the installer, and the earlier
#     releases are all still there;
#   - the installer downloaded from the public release address (not a CI
#     artifact), its SHA-256 compared with the release notes;
#   - installed on a clean runner (screen 1920x1080), every e2e test run
#     against it -- the real Microsoft Korean IME included -- then uninstalled;
#   - every link and picture of the README and the user guide, as GitHub
#     serves them at the tag.
#
# Runs by itself: the tag's own workflow calls it once it has published the
# release (electron.yml, jobs publish -> release-check), and a release
# published by hand (a re-release after a rollback) triggers it.  It can also
# be run by hand with a tag.
name: Release check (as downloaded)

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: true
  release:
    types: [published]

defaults:
  run:
    working-directory: electron

jobs:
  check:
    name: Check ${{ inputs.tag || github.event.release.tag_name }}
    if: startsWith(inputs.tag || github.event.release.tag_name, 'v')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm ci (the tests only)
        run: npm ci --ignore-scripts

      - name: Screen 1920x1080 (tools/windows/screen-1920.ps1)
        continue-on-error: true
        shell: powershell
        run: tools/windows/screen-1920.ps1 -Report report

      - name: Latest, its three assets, and the earlier releases still there
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $latest = gh api "repos/$repo/releases/latest" --jq .tag_name
          if ($latest -ne $env:TAG) { throw "Latest is $latest, not $env:TAG" }
          Write-Host "PASS  Latest: $latest"
          $v = $env:TAG.TrimStart('v')
          $release = gh release view $env:TAG --repo $repo --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw "$env:TAG is a draft or a pre-release" }
          # The installer, and the first screen's film and contact sheet (electron.yml, job film).
          $assets = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $want = @("HallymRISCV-$v-start-screen-1920x1080.mp4", "HallymRISCV-$v-start-screen-sheet.png", "HallymRISCV-$v-win-x64-setup.exe") | Sort-Object
          if (($assets -join '|') -ne ($want -join '|')) { throw "the release's assets should be $($want -join ', '); they are: $($assets -join ', ')" }
          Write-Host "PASS  assets: $($assets -join ', ')"
          # Every release: never deleted.
          $published = @(gh release list --repo $repo --exclude-drafts --limit 200 --json tagName | ConvertFrom-Json | ForEach-Object { $_.tagName })
          $must = @(git tag -l 'v*')
          $gone = @($must | Where-Object { $_ -notin $published })
          if ($gone.Count) { throw "releases gone: $($gone -join ', ')" }
          Write-Host "PASS  still there: $($must -join ', ')"

      - name: Download from the public release and compare SHA-256 with the notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force pub, report | Out-Null
          $body = (gh release view $env:TAG --repo ${{ github.repository }} --json body --jq .body) -join "`n"
          $f = "HallymRISCV-$v-win-x64-setup.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$f"
          Invoke-WebRequest -Uri $url -OutFile "pub/$f"   # no token: what anyone gets
          $h = (Get-FileHash "pub/$f" -Algorithm SHA256).Hash.ToLower()
          $line = "$h  $f"
          Add-Content report/release-check.txt $line
          if ($body -notmatch [regex]::Escape($line)) { throw "SHA-256 of $f ($h) is not the one in the release notes" }
          Write-Host "PASS  $line (as in the notes)"

      - name: Install (per user, silent) and run every e2e test against it
        timeout-minutes: 20
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          $p = Start-Process (Resolve-Path "pub/HallymRISCV-$v-win-x64-setup.exe").Path -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Hallym RISC-V\HallymRISCV.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          Add-Content report/release-check.txt "installed: $exe $version"
          if ($version -notlike "$v*") { throw "installed $version, not $v" }
          tools/windows/korean-ime.ps1 -Report report
          if ($LASTEXITCODE -eq 0) { $env:SPIM_REAL_IME = '1' }
          $env:SPIM_E2E_EXE = $exe
          npx playwright test

      - name: Every link and picture of the published documents, at the tag
        run: node tools/check-doc-links.ts --online ${{ env.TAG }}

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          $e = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like 'Hallym RISC-V*' } | Select-Object -First 1
          if ($e) {
            $un = ($e.QuietUninstallString, $e.UninstallString | Where-Object { $_ } | Select-Object -First 1)
            if ($un -match '^"([^"]+)"\s*(.*)$') { $x = $Matches[1]; $a = $Matches[2] } else { $x = $un; $a = '' }
            if ($a -notmatch '/S') { $a = "$a /S" }
            Start-Process $x -ArgumentList $a -Wait
            Write-Host 'uninstalled'
          }

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check
          path: |
            electron/report/
            electron/test-results/
          if-no-files-found: ignore

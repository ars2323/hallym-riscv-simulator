name: probe
on:
  push:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: echo "RARS_HOME=$RUNNER_TEMP/rars" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: probe/setup.sh
      - run: probe/run.sh all
      - name: checks against the jar built from source
        run: RARS_JAR="$RARS_HOME/rars-src.jar" probe/run.sh checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-results
          path: probe/results/

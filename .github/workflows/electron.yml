# The Electron edition (electron/) with the real engine (RARS in a JVM):
# type check, the unit tests (decoder against RARS, the engine host, memory,
# encodings), every e2e test in a real window; on Linux and on Windows.
#
# The JDK is the one the app will bundle (CLAUDE.md, "JDK"): Eclipse Temurin 21.0.12.
name: electron

on:
  push:
    paths: ['electron/**', 'probe/**', 'docs/engine-protocol.md', '.claude/hooks/**', '.github/workflows/electron.yml']
  pull_request:
    paths: ['electron/**', 'probe/**', 'docs/engine-protocol.md', '.claude/hooks/**', '.github/workflows/electron.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: electron

jobs:
  linux:
    name: Type check, unit tests, e2e (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The engine (the SessionStart hook every Claude session runs)
        working-directory: .
        run: |
          echo "RARS_HOME=$RUNNER_TEMP/rars" >> "$GITHUB_ENV"
          RARS_HOME="$RUNNER_TEMP/rars" CLAUDE_PROJECT_DIR="$PWD" .claude/hooks/session-start.sh
      - name: npm ci
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test
      - name: The engine process, measured (tools/engine-windows.ts; Windows below is what it is for)
        run: node tools/engine-windows.ts --out report
      - name: The decoder's oracle is what RARS says today
        run: |
          node tools/gen-rars-words.ts
          git diff --exit-code tests/core/rars-words.json
      - name: Every e2e test (a real window, xvfb)
        env:
          ELECTRON_DISABLE_SANDBOX: '1'   # Ubuntu 24.04 runners forbid the unprivileged user namespaces Chromium's sandbox needs
        run: node tools/build-ui.ts && xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: electron/test-results/
          if-no-files-found: ignore

  # Windows, where the students are.  The engine is a child process here, which
  # the MIPS edition never had: tools/engine-windows.ts measures it (cold start,
  # Korean through stdio, kill, orphans) and tests/e2e/engine-process.e2e.ts
  # checks the console window and the engines a closed or killed app leaves.
  windows:
    name: Windows — unit, e2e, the engine process measured
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The students' screen, 1920x1080 (the runner starts at 1024x768); reported either way.
      - name: Screen 1920x1080 (tools/windows/screen-1920.ps1)
        continue-on-error: true
        shell: powershell
        run: tools/windows/screen-1920.ps1 -Report report

      # Windows' animation effects on, as on the students' PCs: with them off
      # (the runner's default) Chromium reports prefers-reduced-motion.
      - name: Animation effects on (tools/windows/animations-on.ps1)
        continue-on-error: true
        shell: powershell
        run: tools/windows/animations-on.ps1 -Report report

      - name: The engine (the SessionStart hook, in Git Bash)
        working-directory: .
        shell: bash
        run: |
          rars="$(cygpath -m "$RUNNER_TEMP")/rars"
          echo "RARS_HOME=$rars" >> "$GITHUB_ENV"
          RARS_HOME="$rars" CLAUDE_PROJECT_DIR="$PWD" .claude/hooks/session-start.sh

      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test

      - name: The engine process on Windows, measured (tools/engine-windows.ts)
        run: node tools/engine-windows.ts --out report

      - name: Every e2e test
        timeout-minutes: 25
        run: |
          node tools/build-ui.ts
          npx playwright test

      # An attempt, reported either way: the real Microsoft Korean IME
      # (tests/e2e/ime.e2e.ts, through CDP, is the check that counts).
      - name: Korean IME on the runner (tools/windows/korean-ime.ps1)
        id: koime
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: tools/windows/korean-ime.ps1 -Report report
      - name: e2e with the real Korean IME
        if: steps.koime.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:SPIM_REAL_IME = '1'
          npx playwright test tests/e2e/ime-real.e2e.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-report
          path: |
            electron/report/
            electron/test-results/
          if-no-files-found: ignore

# The Electron edition (electron/) with the real engine (RARS in a JVM):
# type check, the unit tests (decoder against RARS, the engine host, memory,
# encodings), every e2e test in a real window.  Linux only for now; the MIPS
# edition's Windows / installer / release structure is kept in
# electron/docs/ci-from-mips/ for when there is an installer.
#
# The JDK is the one the app will bundle (CLAUDE.md, "JDK"): Eclipse Temurin 21.0.12.
name: electron

on:
  push:
    paths: ['electron/**', 'probe/**', 'docs/engine-protocol.md', '.claude/hooks/**', '.github/workflows/electron.yml']
  pull_request:
    paths: ['electron/**', 'probe/**', 'docs/engine-protocol.md', '.claude/hooks/**', '.github/workflows/electron.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: electron

jobs:
  linux:
    name: Type check, unit tests, e2e (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The engine (the SessionStart hook every Claude session runs)
        working-directory: .
        run: |
          echo "RARS_HOME=$RUNNER_TEMP/rars" >> "$GITHUB_ENV"
          RARS_HOME="$RUNNER_TEMP/rars" CLAUDE_PROJECT_DIR="$PWD" .claude/hooks/session-start.sh
      - name: npm ci
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test
      - name: The decoder's oracle is what RARS says today
        run: |
          node tools/gen-rars-words.ts
          git diff --exit-code tests/core/rars-words.json
      - name: Every e2e test (a real window, xvfb)
        env:
          ELECTRON_DISABLE_SANDBOX: '1'   # Ubuntu 24.04 runners forbid the unprivileged user namespaces Chromium's sandbox needs
        run: node tools/build-ui.ts && xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: electron/test-results/
          if-no-files-found: ignore
